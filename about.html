<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회사소개 — LinkRank</title>
<meta name="description" content="LinkRank의 서비스 목적과 비전을 소개합니다. 올바른 P2P 파일 공유 플랫폼 선택 기준을 제공하기 위해 노력하고 있습니다.">
<meta name="keywords" content="LinkRank, 링크랭크, 회사소개, 파일공유 플랫폼, 서비스 소개">
<link rel="canonical" href="https://yourdomain.com/about.html">
<meta property="og:type" content="article">
<meta property="og:title" content="회사소개 — LinkRank">
<meta property="og:description" content="LinkRank의 서비스 목적과 비전을 소개합니다.">
<meta property="og:url" content="https://yourdomain.com/about.html">
<meta property="og:site_name" content="LinkRank">
<style>
:root{--bg:#f7f8fa;--paper:#ffffff;--ink:#1f242e;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;height:66px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1080px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:18px;display:flex;align-items:center;gap:9px}
.logo-mark{width:29px;height:29px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
nav{display:flex;gap:28px;font-size:14px;color:var(--muted);font-weight:650}nav a:hover{color:var(--accent)}
footer{background:#fff;border-top:1px solid var(--line);padding:35px 24px;text-align:center;color:var(--muted);font-size:13px}
.footer-nav{display:flex;justify-content:center;gap:20px;margin-bottom:15px;font-weight:600;flex-wrap:wrap}
.footer-nav a:hover{color:var(--ink)}
.footer-copy{color:#9ca3af;font-size:12px;margin-top:10px}
.wrap{max-width:800px;margin:50px auto;padding:0 20px;min-height:60vh}
.card{background:#fff;padding:40px;border-radius:20px;border:1px solid #e5e7eb}
h1{font-size:28px;margin-bottom:20px}
</style>
</head>
<body>
<div id="header-container"></div>
<main class="wrap">
  <article class="card">
    <h1>회사소개</h1>
    <p>LinkRank는 올바른 파일 공유 및 P2P 서비스 선택 기준을 제공하기 위해 만들어진 정보 서비스입니다.</p>
    <p>객관적이고 투명한 비교 정보를 전달하여 이용자가 자신에게 최적화된 최선의 선택을 할 수 있도록 지원합니다.</p>
  </article>
</main>
<div id="footer-container"></div>
<script>
fetch('header.html').then(r=>r.text()).then(d=>{document.getElementById('header-container').innerHTML=d});
fetch('footer.html').then(r=>r.text()).then(d=>{document.getElementById('footer-container').innerHTML=d});
</script>
</body>
</html>
